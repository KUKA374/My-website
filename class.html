  <script>
    if (!['9','10','11'].includes(new URLSearchParams(location.search).get('class'))) window.ktpReady=Promise.resolve(window.ktpReady).then(()=>new Promise(resolve=>{
      const classId=new URLSearchParams(location.search).get('class');
      const subjectId=new URLSearchParams(location.search).get('subject');
      const quarter=Number(new URLSearchParams(location.search).get('quarter'));
      const key=classId&&subjectId?`${classId}_${subjectId}`:'';
      const ready=()=>{
        const all=window.ktpD||{};
        return !!(all[key+`_q${quarter}`] || all[key] || (all[classId]&&(all[classId][key]||Array.isArray(all[classId].r))) || Object.keys(all).some(k=>k.startsWith(key+'_q')));
      };
      if(ready()) return resolve(window.ktpD);
      const started=Date.now();
      const timer=setInterval(()=>{
        if(ready() || Date.now()-started>8000){clearInterval(timer);resolve(window.ktpD||{});}
      },50);
    }));
  </script>
