  <script>
    // Жалпы КТП беттерін ескі script.js renderer-і қайта жазбасын.
    // 7-сынып Алгебра 1-тоқсанның ескі беті ғана бұрынғы renderer-мен қалады.
    (function () {
      const p = new URLSearchParams(location.search);
      const isLegacy =
        p.get("class") === "7" &&
        p.get("subject") === "algebra" &&
        p.get("quarter") === "1";

      if (!isLegacy) {
        window.renderQuarterPage = function () {};
      }
    })();
  </script>
  <script src="ktp-render.js?v=9"></script>
