name: Stage 8A Firestore security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/stage-8a-security.yml"
      - "firestore.rules"
      - "firebase-config.js"
      - "security/**"
      - "lesson-materials/**"
      - "tests/emulator/**"
      - "tests/security-ci/**"
      - "tests/fixtures/stage8a-preserved.json"
      - "tests/lesson-material-rules.test.cjs"
      - "tests/lesson-material-security-contract.test.cjs"
      - "tests/run-lesson-security-qa.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-8a-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firestore-security:
    name: Firestore emulator (7 security tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      IUSTAZ_FIREBASE_TOOLS: ${{ github.workspace }}/tests/security-ci
      IUSTAZ_SECURITY_REPORT_DIR: ${{ github.workspace }}/.stage-8a-security-report
    steps:
      - name: Checkout PR without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, native Node.js 24
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, native Node.js 24
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: tests/security-ci/package-lock.json
      - name: Set up Java for the official emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, native Node.js 24
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked emulator tools without lifecycle scripts
        run: npm ci --prefix tests/security-ci --ignore-scripts --no-audit --no-fund
      - name: Verify production rules and legacy permissions are preserved
        run: node tests/lesson-material-security-contract.test.cjs
      - name: Run the seven actual Firestore security tests on localhost
        run: >-
          tests/security-ci/node_modules/.bin/firebase emulators:exec
          --config security/firebase.emulator.json
          --project demo-iustaz-stage8a --only firestore
          'node tests/run-lesson-security-qa.cjs'
      - name: Record job outcome
        if: always()
        env:
          SECURITY_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$IUSTAZ_SECURITY_REPORT_DIR"
          printf 'Job status: %s\n' "$SECURITY_JOB_STATUS" > "$IUSTAZ_SECURITY_REPORT_DIR/job-status.txt"
          printf '\nStage 8A security job: **%s**. No Firebase deployment was performed.\n' "$SECURITY_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test output and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, native Node.js 24
        with:
          name: stage-8a-security-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ github.workspace }}/.stage-8a-security-report/
            tests/emulator/*-debug.log
            security/*-debug.log
            *-debug.log
