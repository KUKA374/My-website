<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ойындар | Math Teacher</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .games-page{padding:35px 0 70px}.games-intro{margin-bottom:28px}.games-intro h1{font-size:clamp(30px,5vw,44px);margin:12px 0 8px}.games-intro p{color:#687386;max-width:780px}.games-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.game-card{display:flex;text-align:left;gap:16px;padding:20px;border:1px solid #e4e8f0;border-radius:17px;background:#fff;cursor:pointer;font:inherit;color:inherit;transition:.2s}.game-card:hover,.game-card.selected{border-color:#a5b4fc;box-shadow:0 10px 28px rgba(30,40,70,.08);transform:translateY(-2px)}.game-icon{font-size:38px;min-width:50px}.game-card h3{margin:0 0 6px;font-size:19px}.game-card p{margin:0 0 10px;color:#687386;font-size:14px;line-height:1.5}.game-tags{display:flex;gap:6px;flex-wrap:wrap}.game-tags span{padding:4px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:700}.game-setup,.game-area{margin-top:28px;background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:24px}.game-setup h2{margin:0 0 6px}.game-setup p{color:#687386}.setup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.setup-field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.setup-field select{width:100%;padding:11px;border:1px solid #d8deea;border-radius:9px;background:#fff;font:inherit}.game-primary{border:0;border-radius:10px;background:#3157d5;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.game-primary:hover{opacity:.92}.game-message{display:none;margin-top:14px;padding:13px;border-radius:10px;background:#fff7ed;color:#9a3412}.game-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.game-progress{padding:6px 10px;background:#eef2ff;color:#4338ca;border-radius:8px;font-weight:700;font-size:13px}.game-task{padding:22px;border:1px solid #edf0f5;border-radius:14px;background:#fafbfc}.game-task h3{margin-top:0}.game-prompt{font-size:23px;font-weight:700;margin:20px 0}.answer-buttons{display:flex;gap:10px;flex-wrap:wrap}.answer-buttons button{padding:11px 15px;border:1px solid #d8deea;background:#fff;border-radius:9px;cursor:pointer;font:inherit}.game-task input,.game-task textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8deea;border-radius:9px;font:inherit;margin:8px 0 12px}.game-task textarea{min-height:110px;resize:vertical}.code-progress{color:#687386;font-size:13px}.game-finish{text-align:center;padding:30px}.finish-icon{font-size:55px}.game-finish h2{margin:8px 0}.game-finish p{font-size:18px}.game-result{margin-top:12px;color:#4338ca;font-weight:700}@media(max-width:750px){.games-grid,.setup-grid{grid-template-columns:1fr}.games-page{padding-top:22px}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">📐 Math Teacher</a>
      <nav class="main-nav">
        <a href="index.html">Басты бет</a>
        <a href="class.html?class=7&subject=algebra&quarter=1">Сабақтар</a>
        <a href="qmj.html">📄 ҚМЖ</a>
        <a href="games.html">🎮 Ойындар</a>
        <a href="index.html#favorites">⭐ Таңдаулылар</a>
        <a href="index.html#my-lessons">📚 Менің сабақтарым</a>
        <a href="admin.html">⚙️ Басқару</a>
      </nav>
    </div>
  </header>

  <main class="container games-page">
    <section class="games-intro">
      <span class="badge">🎮 Қайта қолданылатын ойындар базасы</span>
      <h1>Математикалық ойындар</h1>
      <p>Ойын механизмі бір рет жасалады. Кейін оған кез келген сыныптың, пәннің және тақырыптың есептерін қосуға болады.</p>
    </section>

    <section>
      <h2>Ойын түрін таңдаңыз</h2>
      <div id="gamesGrid" class="games-grid"></div>
    </section>

    <section id="gameSetup" class="game-setup" style="display:none;">
      <h2 id="selectedGameTitle"></h2>
      <p id="selectedGameDescription"></p>
      <div class="setup-grid">
        <div class="setup-field"><label>Сынып</label><select id="gradeSelect"><option value="7">7-сынып</option></select></div>
        <div class="setup-field"><label>Пән</label><select id="subjectSelect"><option value="algebra">Алгебра</option></select></div>
        <div class="setup-field"><label>Тоқсан</label><select id="quarterSelect"><option value="1">1-тоқсан</option></select></div>
        <div class="setup-field" style="grid-column:1/-1;"><label>Тақырып / сабақ</label><select id="lessonSelect"></select></div>
      </div>
      <button id="startGameButton" class="game-primary">▶️ Ойынды бастау</button>
      <div id="gameMessage" class="game-message"></div>
    </section>

    <section id="gameArea" class="game-area" style="display:none;">
      <div class="game-top"><h2>Ойын</h2><span id="gameProgress" class="game-progress"></span></div>
      <div id="gameQuestion"></div>
      <div id="gameResult" class="game-result"></div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>requireRole(["teacher","admin","super_admin"]);</script>
  <script src="curriculum-data.js"></script>
  <script src="7-synyp-algebra-1-toqsan-data.js"></script>
  <script src="games-data.js"></script>
  <script src="games.js"></script>
</body>
</html>
