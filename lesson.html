<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Сабақ | Math Teacher</title><link rel="stylesheet" href="style.css">
<style>
.lesson-page{max-width:1000px;margin:0 auto;padding:28px 0 60px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 12px}.meta span{padding:5px 9px;border-radius:8px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:700}.lesson-title{margin:0 0 10px;font-size:clamp(27px,4vw,40px);line-height:1.2}.objective{color:#687386;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.action{border:1px solid #d1d5db;border-radius:9px;background:#fff;padding:9px 12px;cursor:pointer;font:inherit}.action.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}.block{border:1px solid #e5e7eb;border-radius:15px;background:#fff;margin:12px 0;overflow:hidden}.block summary{cursor:pointer;padding:16px 18px;font-weight:700;list-style:none}.block summary::-webkit-details-marker{display:none}.body{padding:0 18px 18px;color:#374151;line-height:1.65}.note{padding:12px;border-radius:10px;background:#f8fafc;color:#667085;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid #eef0f4;border-radius:10px;padding:12px;background:#fafbfc}.card strong{display:block;color:#4338ca;margin-bottom:4px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="container"><div id="lessonPage"></div></main>
<script src="auth.js"></script><script>requireRole(["teacher","admin","super_admin"]);</script><script src="curriculum-data.js?v=5"></script><script src="ktp-data.js?v=5"></script><script src="ktp-5-q1.js?v=1"></script><script src="ktp-5-q2.js?v=1"></script><script src="ktp-5-q2-loader.js?v=1"></script><script src="ktp-5-q3.js?v=1"></script><script src="ktp-5-q4.js?v=1"></script><script src="lesson-content.js"></script><script src="my-lessons.js"></script>
<script>
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
function params(){const p=new URLSearchParams(location.search);return{classId:String(p.get('class')||''),subjectId:String(p.get('subject')||''),quarter:Number(p.get('quarter')),lesson:String(p.get('lesson')||'')}}
function getSubject(classId,subjectId){const c=window.curriculum&&window.curriculum[classId];return c&&c.subjects?c.subjects.find(s=>String(s.id)===String(subjectId)):null}
function getKtpLesson(){const p=params(),s=getSubject(p.classId,p.subjectId),key=s&&s.planKey?s.planKey:`${p.classId}_${p.subjectId}`,all=window.ktpD||{};let src=all[key];if(!src&&all[p.classId]&&all[p.classId][key])src=all[p.classId][key];if(!src)return null;if(Array.isArray(src)){const r=src.find(x=>Number(x?.quarter)===p.quarter&&String(x?.lesson??x?.number)===p.lesson);if(!r)return null;return{number:r.lesson??r.number,section:r.section||'',title:r.title||'',objective:r.objective||'',hours:r.hours||1,planKey:key,subject:s}}if(Array.isArray(src.rows)){const r=src.rows.find(x=>Number(x?.[1])===p.quarter&&String(x?.[0])===p.lesson);if(!r)return null;return{number:r[0],section:(src.sections||[])[r[2]]||'',title:(src.titles||[])[r[3]]||'',objective:(src.objectives||[])[r[4]]||'',hours:1,planKey:key,subject:s}}return null}
function savedContent(id){try{return typeof lessonContent!=='undefined'&&lessonContent[id]?lessonContent[id]:{}}catch(e){return{}}}
function placeholder(text){return `<p class="note">${text}</p>`}
function render(){const root=document.getElementById('lessonPage');const p=params();if(!root||!p.classId||!p.subjectId||!p.quarter||!p.lesson)return;const l=getKtpLesson();if(!l){root.innerHTML='<div class="admin-box"><h3>Сабақ табылмады</h3><p>Бұл сабақ КТП деректерінен табылмады.</p></div>';return}const c=savedContent(`${p.classId}_${p.subjectId}_${p.quarter}_${p.lesson}`);const legacy=savedContent(p.lesson);const content=Object.assign({},legacy,c);const fav=typeof getFavorites==='function'?getFavorites():[];const mine=typeof isMyLesson==='function'?isMyLesson(`${p.classId}_${p.subjectId}_${p.quarter}_${p.lesson}`):false;const back=`class.html?class=${encodeURIComponent(p.classId)}&subject=${encodeURIComponent(p.subjectId)}&quarter=${p.quarter}`;const subjectTitle=l.subject?l.subject.title:p.subjectId;root.innerHTML=`<div class="lesson-page"><a href="${back}" class="back-link">← Сабақтарға қайту</a><div class="meta"><span>${esc(p.classId)}-сынып</span><span>${esc(subjectTitle)}</span><span>${p.quarter}-тоқсан</span><span>Сабақ №${esc(l.number)}</span><span>${esc(l.hours)} сағат</span></div><h1 class="lesson-title">${esc(l.title)}</h1>${l.section?`<p><strong>Бөлім:</strong> ${esc(l.section)}</p>`:''}${l.objective?`<p class="objective"><strong>Оқу мақсаты:</strong> ${esc(l.objective)}</p>`:''}<div class="actions"><button id="favoriteButton" class="action" onclick="toggleFavorite('${esc(p.classId+'_'+p.subjectId+'_'+p.quarter+'_'+p.lesson)}')">${fav.includes(p.classId+'_'+p.subjectId+'_'+p.quarter+'_'+p.lesson)?'⭐ Таңдаулыдан өшіру':'☆ Таңдаулыға қосу'}</button><button class="action" onclick="window.print()">🖨 Басып шығару</button><a class="action" href="constructor.html">🛠 Сабақ конструкторы</a></div>${mine?'<p class="note">✓ Бұл сабақ «Менің сабақтарымда» сақталған.</p>':''}<details class="block" open><summary>📚 Тақырыпты түсіндіру</summary><div class="body">${content.theory||content.explanation||placeholder('Түсіндірме материалын Admin Panel арқылы қосуға болады.')}</div></details><details class="block"><summary>⏱ 45 минуттық сабақ жоспары</summary><div class="body">${Array.isArray(content.lessonPlan)?'<div class="grid">'+content.lessonPlan.map(x=>`<div class="card"><strong>${esc(x[0])}</strong>${esc(x[1])}</div>`).join('')+'</div>':placeholder('45 минуттық толық жоспар кейін осы КТП тақырыбына байланысты қосылады.')}</div></details><details class="block"><summary>👥 Жұптық жұмыс</summary><div class="body">${content.pairWork||placeholder('Жұптық жұмыс кейін қосылады.')}</div></details><details class="block"><summary>👨‍👩‍👧‍👦 Топтық жұмыс</summary><div class="body">${content.groupWork||placeholder('Топтық жұмыс кейін қосылады.')}</div></details><details class="block"><summary>✏️ Жеке жұмыс</summary><div class="body">${content.individualWork||placeholder('Жеке жұмыс кейін қосылады.')}</div></details><details class="block"><summary>🎮 Ойын</summary><div class="body">${content.game||placeholder('Ойын кейін қосылады.')}</div></details><details class="block"><summary>✅ Бағалау және дескрипторлар</summary><div class="body">${content.assessment||placeholder('Бағалау және дескрипторлар кейін қосылады.')}</div></details><details class="block"><summary>🏠 Үй тапсырмасы</summary><div class="body">${content.homework||placeholder('Үй тапсырмасы кейін қосылады.')}</div></details></div>`}
document.addEventListener('DOMContentLoaded',async()=>{try{if(window.ktpReady)await window.ktpReady;render()}catch(e){console.error(e);document.getElementById('lessonPage').innerHTML='<div class="admin-box"><h3>КТП жүктелмеді</h3><p>КТП деректерін жүктеу кезінде қате болды.</p></div>'}})
</script></body></html>
