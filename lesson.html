<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Сабақ | Math Teacher</title><link rel="stylesheet" href="style.css">
  <style>
    .lesson-page-new{max-width:1000px;margin:0 auto;padding:28px 0 60px}.lesson-top{margin:18px 0 20px}.lesson-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.lesson-meta span{padding:5px 9px;border-radius:8px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:700}.lesson-title-new{margin:0 0 10px;font-size:clamp(27px,4vw,40px);line-height:1.2}.lesson-objective{margin:0 0 14px;color:#687386;line-height:1.5}.lesson-actions{display:flex;gap:8px;flex-wrap:wrap}.lesson-action{border:1px solid #d1d5db;border-radius:9px;background:#fff;padding:9px 12px;cursor:pointer;font-size:13px}.lesson-action:hover{background:#f5f7ff;border-color:#a5b4fc}.lesson-action.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}.lesson-action:disabled{cursor:not-allowed;opacity:.55;background:#f3f4f6;color:#6b7280}.lesson-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}.tool-card{border:1px solid #e5e7eb;border-radius:13px;background:#fff;padding:14px}.tool-card strong{display:block;margin-bottom:4px;font-size:14px}.tool-card span{font-size:12px;color:#7a8495}.lesson-block{border:1px solid #e5e7eb;border-radius:15px;background:#fff;margin:12px 0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.03)}.lesson-block summary{list-style:none;cursor:pointer;padding:16px 18px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between}.lesson-block summary::-webkit-details-marker{display:none}.lesson-block summary::after{content:"＋";font-size:18px;color:#7c8595}.lesson-block[open] summary::after{content:"−"}.lesson-body{padding:0 18px 18px;color:#374151;line-height:1.6;font-size:14px}.lesson-body p:first-child{margin-top:0}.lesson-body ul{padding-left:20px}.video-box{background:#111827;border-radius:12px;overflow:hidden;min-height:210px;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;box-sizing:border-box}.video-box iframe{width:100%;aspect-ratio:16/9;border:0}.video-placeholder strong{display:block;font-size:18px;margin-bottom:6px}.video-placeholder span{font-size:13px;color:#cbd5e1}.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.plan-item{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid #eef0f4;border-radius:9px;background:#fafbfc;font-size:13px}.plan-item span{font-weight:700;color:#4338ca;white-space:nowrap}.quiz-box{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fafbff}.quiz-question{margin-bottom:15px}.quiz-question strong{display:block;margin-bottom:8px}.quiz-question label{display:block;padding:6px 8px;border-radius:7px;cursor:pointer}.quiz-question label:hover{background:#eef2ff}.quiz-result{margin-top:10px;font-weight:700;min-height:20px}.empty-note{margin:0;color:#8a94a6;font-style:italic}.section-note{margin-top:12px;padding:10px 12px;background:#f8fafc;border-radius:9px;color:#667085;font-size:12px}.admin-edit-note{margin:0 0 10px;padding:10px 12px;border-radius:9px;background:#f0fdf4;color:#166534;font-size:12px}
    @media(max-width:700px){.lesson-tools{grid-template-columns:1fr}.plan-grid{grid-template-columns:1fr}.lesson-page-new{padding:20px 0 40px}}@media print{.header,.lesson-actions,.lesson-tools,.back-link{display:none!important}.lesson-page-new{max-width:none;padding:0}.lesson-block{break-inside:avoid;box-shadow:none}}
  </style>
</head>
<body><main class="container"><div id="lessonPage"></div></main>
<script src="auth.js"></script><script>requireRole(["teacher","admin","super_admin"]);</script><script src="data.js"></script><script src="curriculum-data.js"></script><script src="7-synyp-algebra-1-toqsan-data.js"></script><script src="lesson-content.js"></script><script src="script.js"></script>
<script>
function escapeHtml(value){return String(value||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");}
function renderVideo(videoUrl){if(!videoUrl)return `<div class="video-placeholder"><strong>🎥 Видеосабақ</strong><span>Бұл тақырыпқа видео кейін қосылады.</span></div>`;const match=videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/);if(match)return `<iframe src="https://www.youtube.com/embed/${escapeHtml(match[1])}" title="Видеосабақ" allowfullscreen></iframe>`;return `<div class="video-placeholder"><strong>🎥 Видеосабақ</strong><a href="${escapeHtml(videoUrl)}" target="_blank" rel="noopener" style="color:#fff">Видеоны ашу →</a></div>`;}
function renderContent(content,emptyText){if(content===null||content===undefined||content==="")return `<p class="empty-note">${emptyText||"Бұл бөлім әзірге қосылмаған."}</p>`;return content;}
function renderPlan(plan){if(!Array.isArray(plan)||plan.length===0)return `<p class="empty-note">45 минуттық жоспар кейін толықтырылады.</p>`;return `<div class="plan-grid">${plan.map(function(item){return `<div class="plan-item"><div>${item[0]}</div><span>${item[1]}</span></div>`;}).join("")}</div>`;}
function renderQuiz(){return `<div class="quiz-box"><div class="quiz-question"><strong>1. 2 : 3 = x : 12 болса, x неге тең?</strong><label><input type="radio" name="q1" value="6"> 6</label><label><input type="radio" name="q1" value="8"> 8</label><label><input type="radio" name="q1" value="10"> 10</label></div><div class="quiz-question"><strong>2. Пропорцияның негізгі қасиеті қайсы?</strong><label><input type="radio" name="q2" value="a"> a + d = b + c</label><label><input type="radio" name="q2" value="b"> a · d = b · c</label><label><input type="radio" name="q2" value="c"> a - b = c - d</label></div><div class="quiz-question"><strong>3. 4 : 5 = 8 : x болса, x неге тең?</strong><label><input type="radio" name="q3" value="8"> 8</label><label><input type="radio" name="q3" value="10"> 10</label><label><input type="radio" name="q3" value="12"> 12</label></div><button class="lesson-action primary" onclick="checkQuiz()">Жауаптарды тексеру</button><div id="quizResult" class="quiz-result"></div></div>`;}
function checkQuiz(){const answers={q1:"8",q2:"b",q3:"10"};let score=0;Object.keys(answers).forEach(function(key){const selected=document.querySelector(`input[name="${key}"]:checked`);if(selected&&selected.value===answers[key])score++;});document.getElementById("quizResult").textContent=`Нәтиже: ${score}/3`;}
function getAdminMaterial(id){try{return JSON.parse(localStorage.getItem("mathTeacherMaterial_"+id)||"null");}catch(e){return null;}}
function renderCompactLessonPage(){
  const container=document.getElementById("lessonPage");if(!container||typeof grade7AlgebraQ1==="undefined")return;const params=new URLSearchParams(window.location.search);const lessonId=params.get("lesson");const lesson=grade7AlgebraQ1.lessons.find(function(item){return String(item.id)===String(lessonId);});if(!lesson)return;
  const base=(typeof lessonContent!=="undefined"&&lessonContent[lesson.id])?lessonContent[lesson.id]:{};const saved=getAdminMaterial(lesson.id)||{};const content=Object.assign({},base,saved);const lessonData=lesson.lesson||{};const favoriteIds=typeof getFavorites==="function"?getFavorites():[];const isFavorite=favoriteIds.includes(String(lesson.id));
  const theory=content.theory||lessonData.explanation,pairWork=content.pairWork||lessonData.pairWork,groupWork=content.groupWork||lessonData.groupWork,individualWork=content.individualWork||lessonData.individualWork,game=content.game||lessonData.game,assessment=content.assessment||lessonData.assessment,homework=content.homework||lessonData.homework;
  const hasSaved=Object.keys(saved).some(function(k){return k!=="updatedAt"&&saved[k];});
  container.innerHTML=`<div class="lesson-page-new"><a href="class.html?class=7&subject=algebra&quarter=1" class="back-link">← Сабақтарға қайту</a><section class="lesson-top"><div class="lesson-meta"><span>7-сынып</span><span>Алгебра</span><span>1-тоқсан</span><span>Сабақ №${lesson.number}</span></div><h1 class="lesson-title-new">${lesson.title}</h1>${lesson.objective?`<p class="lesson-objective">${lesson.objective}</p>`:""}<div class="lesson-actions"><button id="favoriteButton" class="lesson-action" onclick="toggleFavorite('${lesson.id}')">${isFavorite?"⭐ Таңдаулыдан өшіру":"☆ Таңдаулыға қосу"}</button><button class="lesson-action" onclick="window.print()">🖨 Басып шығару</button><button class="lesson-action" onclick="alert('AI көмекші үшін серверлік бөлік қосылады. API кілті сайттың ашық кодына жазылмайды.')">🤖 AI көмекші</button><a class="lesson-action" href="constructor.html">🛠 Сабақ конструкторы</a><button class="lesson-action" disabled>📄 ҚМЖ жүктеу</button></div></section>${hasSaved?'<p class="admin-edit-note">✓ Бұл сабақтың материалын Admin Panel арқылы жаңартқансыз.</p>':''}<section class="lesson-tools"><div class="tool-card"><strong>⏱ 45 минут</strong><span>Дайын сабақ құрылымы</span></div><div class="tool-card"><strong>⭐ Таңдаулы</strong><span>Сабақты кейін тез табу</span></div><div class="tool-card"><strong>🖨 Print</strong><span>Материалды қағазға шығару</span></div></section><details class="lesson-block" open><summary>🎥 Видеосабақ</summary><div class="lesson-body"><div class="video-box">${renderVideo(content.videoUrl||"")}</div></div></details><details class="lesson-block" open><summary>📚 Тақырыпты түсіндіру</summary><div class="lesson-body">${renderContent(theory)}<h3>🧮 Мысалмен түсіндіру</h3>${renderContent(content.examples)}<h3>⚠️ Жиі жіберілетін қателер</h3>${renderContent(content.commonMistakes)}</div></details><details class="lesson-block" open><summary>⏱ 45 минуттық сабақ жоспары</summary><div class="lesson-body">${renderPlan(content.lessonPlan)}</div></details><details class="lesson-block"><summary>👥 Жұптық жұмыс</summary><div class="lesson-body">${renderContent(pairWork)}</div></details><details class="lesson-block"><summary>👨‍👩‍👧‍👦 Топтық жұмыс</summary><div class="lesson-body">${renderContent(groupWork)}</div></details><details class="lesson-block"><summary>✏️ Жеке жұмыс</summary><div class="lesson-body">${renderContent(individualWork)}</div></details><details class="lesson-block"><summary>🎮 Ойын</summary><div class="lesson-body">${renderContent(game)}${lesson.id===1?renderQuiz():""}</div></details><details class="lesson-block"><summary>✅ Бағалау және дескрипторлар</summary><div class="lesson-body">${renderContent(assessment)}</div></details><details class="lesson-block"><summary>🏠 Үй тапсырмасы</summary><div class="lesson-body">${renderContent(homework)}</div></details><div class="section-note">💡 Бұл сабақтың материалдары КТП-дан бөлек сақталады. Admin Panel-дегі жаңа материал осы браузерде сақталып, сабақ бетінде көрсетіледі.</div></div>`;
}
document.addEventListener("DOMContentLoaded",renderCompactLessonPage);
</script></body></html>
